<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attest — 工时表自己填好，每一小时都能追到来源</title>
<meta name="description" content="Timesheets drafted from the traces your work already left — meetings, mail, files, tickets, focus windows. Every hour traceable to its source record.">
<style>
:root {
  color-scheme: light;
  --bg:#faf9f6; --card:#fff; --ink:#0b0b0b; --ink2:#55534d; --ink3:#8b8983;
  --line:#e3e1d9; --rule:#c9c7bc;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --grey:#b8b6ad; --red:#d03b3b; --raise:rgba(11,11,11,.04);
  --f: system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#0d0d0c; --card:#1a1a18; --ink:#fff; --ink2:#c3c2b7; --ink3:#8b8983;
  --line:#2c2c29; --rule:#3a3a36;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --grey:#55534d; --raise:rgba(255,255,255,.05);
}
*,*::before,*::after { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--f); -webkit-font-smoothing:antialiased }
h1,h2 { margin:0; font-weight:680; letter-spacing:-.02em; line-height:1.12 }
p { margin:0 }
a { color:var(--s1) }
.wrap { max-width:1060px; margin:0 auto; padding:0 26px }

/* ── top ─────────────────────────────────────────────────────────────── */
.top { display:flex; align-items:center; justify-content:space-between; padding:22px 0 0 }
.logo { font-size:14px; font-weight:700 } .logo i { color:var(--ink3); font-style:normal; font-weight:500 }
.tools { display:flex; gap:8px }
.b { font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; padding:6px 12px; border-radius:8px;
     border:1px solid var(--line); background:var(--card); color:var(--ink); text-decoration:none }
.b:hover { background:var(--raise) }
.b.p { background:var(--s1); border-color:var(--s1); color:#fff }

/* ── hero ────────────────────────────────────────────────────────────── */
.hero { padding:62px 0 10px }
.hero h1 { font-size:clamp(30px,5vw,54px) }
.hero .s { margin-top:16px; font-size:clamp(15px,1.7vw,19px); color:var(--ink2); max-width:48ch; line-height:1.45 }

/* ── 四格漫画 ────────────────────────────────────────────────────────── */
.strip { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:34px 0 0 }
@media (max-width:760px) { .strip { grid-template-columns:1fr } }
.cell { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; position:relative }
.cell .no {
  position:absolute; top:12px; left:14px; z-index:2; width:26px; height:26px; border-radius:50%;
  background:var(--ink); color:var(--bg); font-size:13px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.cell svg { display:block; width:100%; height:auto; color:var(--ink) }
.cell .txt { padding:2px 20px 20px }
.cell .q { font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink3) }
.cell .a { font-size:clamp(17px,2vw,21px); font-weight:670; margin-top:6px; line-height:1.3; letter-spacing:-.01em }
.cell .a em { font-style:normal; color:var(--red) }
.cell .a b { color:var(--s3) }

/* ── section frame ───────────────────────────────────────────────────── */
.sec { padding:96px 0 0 }
.sec > .k { font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3) }
.sec > h2 { font-size:clamp(24px,3.4vw,36px); margin-top:12px; max-width:26ch }
.sec > .l { margin-top:14px; font-size:15.5px; color:var(--ink2); max-width:54ch; line-height:1.5 }
.fig { margin-top:32px }
.cap { margin-top:13px; font-size:13px; color:var(--ink3); max-width:62ch; line-height:1.5 }

/* ── 溯源图 ──────────────────────────────────────────────────────────── */
.trace { display:grid; grid-template-columns:1fr 34px minmax(280px,.9fr); gap:0; align-items:center }
@media (max-width:840px) { .trace { grid-template-columns:1fr; gap:14px } .trace .arrow { transform:rotate(90deg) } }
.srcs { display:flex; flex-direction:column; gap:7px }
.src {
  display:grid; grid-template-columns:20px 96px 1fr; gap:11px; align-items:center;
  background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 13px;
}
.src svg { width:19px; height:19px; color:var(--ink3); flex:none }
.src .n { font-size:12.5px; font-weight:640 }
.src .v { font-size:11.5px; color:var(--ink2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.arrow { display:flex; align-items:center; justify-content:center; color:var(--ink3); font-size:30px; font-weight:300 }
.outrow { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px }
.outrow .d { font-size:11.5px; color:var(--ink3); font-weight:600 }
.outrow .c { font-size:19px; font-weight:670; margin:4px 0 2px; display:flex; align-items:center; gap:9px }
.outrow .c i { width:10px; height:10px; border-radius:3px; flex:none; font-style:normal }
.outrow .h { font-size:32px; font-weight:680; letter-spacing:-.02em; margin-top:8px }
.outrow .h small { font-size:15px; color:var(--ink2); font-weight:600 }
.outrow .badge {
  display:inline-block; margin-top:10px; font-size:11.5px; font-weight:650; padding:3px 9px;
  border-radius:999px; background:rgba(27,175,122,.13); color:var(--s3);
}
.never { margin-top:16px; display:flex; flex-wrap:wrap; gap:8px }
.never span {
  font-size:12px; color:var(--ink2); border:1px solid var(--line); border-radius:999px;
  padding:5px 12px; background:var(--card);
}
.never span::before { content:"✕ "; color:var(--red); font-weight:700 }

/* ── 顶层 vs 每人 ────────────────────────────────────────────────────── */
.two { display:grid; grid-template-columns:1fr 1fr; gap:16px }
@media (max-width:760px) { .two { grid-template-columns:1fr } }
.pane { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px 20px }
.pane.no { border-color:rgba(208,59,59,.3) } .pane.yes { border-color:rgba(42,120,214,.34) }
.pane h3 { margin:0 0 2px; font-size:15.5px; font-weight:660 }
.pane .sub { font-size:12.5px; color:var(--ink2); min-height:34px }
.pane svg { display:block; width:100%; height:auto; margin-top:4px }
.walls { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px }
@media (max-width:760px) { .walls { grid-template-columns:1fr } }
.wall { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px }
.wall .i { font-size:19px; line-height:1 }
.wall .t { font-size:14px; font-weight:650; margin:8px 0 4px }
.wall .d { font-size:12.5px; color:var(--ink2); line-height:1.45 }

/* ── 原理四步 ────────────────────────────────────────────────────────── */
.steps { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px 14px }
.srow { display:grid; grid-template-columns:210px 1fr; gap:22px; align-items:center; padding:15px 0 }
.srow + .srow { border-top:1px solid var(--line) }
@media (max-width:760px) { .srow { grid-template-columns:1fr; gap:9px } }
.srow .n { font-size:11px; font-weight:700; color:var(--ink3); letter-spacing:.08em }
.srow .t { font-size:15px; font-weight:650; margin:3px 0 4px }
.srow .d { font-size:12.5px; color:var(--ink2); line-height:1.45 }
.viz { height:48px; position:relative }
.viz .dot { position:absolute; width:6px; height:6px; border-radius:50%; background:var(--ink3); margin-left:-3px }
.viz .bar { position:absolute; height:22px; border-radius:5px; top:4px }
.viz .bar.dash { outline:2px dashed var(--ink); outline-offset:-3px }
.viz .bar.hatch { background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.3) 0 3px,transparent 3px 6px) }
.viz .cut { position:absolute; top:0; height:30px; width:2px; background:var(--ink) }
.viz .drop { position:absolute; top:10px; height:8px; border-top:2px dotted var(--red) }
.viz .dl { position:absolute; top:22px; font-size:10.5px; font-weight:650; color:var(--red);
           white-space:nowrap; transform:translateX(-50%) }
.ax { display:flex; justify-content:space-between; margin-left:232px; padding-top:7px; border-top:1px solid var(--rule) }
.ax span { font-size:11px; color:var(--ink3) }
@media (max-width:760px) { .ax { margin-left:0 } }

/* ── 结果表 ──────────────────────────────────────────────────────────── */
.sheet { border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--card) }
.r { display:grid; grid-template-columns:minmax(140px,1.4fr) repeat(5,1fr) 70px }
.r + .r { border-top:1px solid var(--line) }
.hd { font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink3);
      padding:10px 11px; background:var(--raise) }
.c { padding:12px 11px; font-size:13.5px; text-align:center; font-variant-numeric:tabular-nums }
.c.l { text-align:left; display:flex; align-items:center; gap:8px; font-size:13px }
.c.t { font-weight:660; background:var(--raise) } .c.e { color:var(--rule) }
.sw { width:9px; height:9px; border-radius:3px; flex:none }
.sw.h { background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.34) 0 2px,transparent 2px 4px) }
.pill { display:inline-block; padding:2px 9px; border-radius:6px; font-weight:640; color:#fff; font-size:13px }
.pill.g { background:var(--grey); color:var(--ink) }
.nums { display:grid; grid-template-columns:repeat(4,1fr); gap:11px; margin-top:26px }
@media (max-width:760px) { .nums { grid-template-columns:1fr 1fr } }
.nm { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:15px 17px }
.nm .v { font-size:29px; font-weight:670; letter-spacing:-.02em } .nm .v small { font-size:14px; color:var(--ink2) }
.nm .k { font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--ink3); margin-top:2px }
.cta { margin-top:30px; display:flex; gap:11px; flex-wrap:wrap }

footer { margin-top:90px; border-top:1px solid var(--line) }
footer .wrap { padding:26px 26px 70px }
footer p { font-size:12px; color:var(--ink3); line-height:1.6; max-width:80ch }
footer p + p { margin-top:7px }
#tp { position:fixed; z-index:60; pointer-events:none; opacity:0; transition:opacity .1s; max-width:250px;
      background:var(--ink); color:var(--bg); font-size:12px; line-height:1.45; padding:7px 10px;
      border-radius:7px; box-shadow:0 6px 20px rgba(0,0,0,.25) }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">Attest <i>· prototype</i></div>
    <div class="tools">
      <button class="b" id="lang">EN</button>
      <button class="b" id="theme">Dark</button>
      <a class="b p" id="deep" href="./dashboard.html">—</a>
    </div>
  </div>
  <div class="hero"><h1 id="h1">—</h1><p class="s" id="hs">—</p></div>
  <div class="strip" id="strip"></div>

  <section class="sec">
    <div class="k" id="k-src">—</div><h2 id="h-src">—</h2><p class="l" id="l-src">—</p>
    <div class="fig trace" id="trace"></div>
    <div class="never" id="never"></div>
    <p class="cap" id="c-src">—</p>
  </section>

  <section class="sec">
    <div class="k" id="k-top">—</div><h2 id="h-top">—</h2>
    <div class="fig two" id="two"></div>
    <div class="walls" id="walls"></div>
  </section>

  <section class="sec">
    <div class="k" id="k-how">—</div><h2 id="h-how">—</h2>
    <div class="fig steps" id="steps"></div>
    <p class="cap" id="c-how">—</p>
  </section>

  <section class="sec">
    <div class="k" id="k-out">—</div><h2 id="h-out">—</h2><p class="l" id="l-out">—</p>
    <div class="fig sheet" id="sheet"></div>
    <div class="nums" id="nums"></div>
    <div class="cta">
      <a class="b p" id="cta1" href="./dashboard.html">—</a>
      <a class="b" href="https://github.com/ChrisZHHG/devvalue">GitHub</a>
    </div>
  </section>
</div>
<footer><div class="wrap"><p id="f1">—</p><p id="f2">—</p></div></footer>
<div id="tp" role="tooltip"></div>
<script src="./demo-data.js"></script>
<script src="./story.js"></script>
</body>
</html>
